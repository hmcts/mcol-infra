trigger:
  batch: true
  branches:
    include:
      - main

pr:
  - main

schedules:
  - cron: "0 18 * * 1-5"
    displayName: Daily 6pm build
    branches:
      include:
        - main
    always: "true"

resources:
  repositories:
    - repository: cnp-azuredevops-libraries
      type: github
      ref: refs/heads/master
      name: hmcts/cnp-azuredevops-libraries
      endpoint: 'hmcts'

parameters:
  - name: overrideAction
    type: string
    default: plan
    values:
      - plan
      - apply
      - destroy
  - name: environment_components
    type: object
    default:
      - deployment: 'stg_core'
        environment: 'stg'
        component: 'core'
        service_connection: 'DTS-HERITAGE-EXTSVC-STG'
        dependsOn: 'Precheck'
        destroyDependsOn: 'stg_vm'
      - deployment: 'stg_vm'
        environment: 'stg'
        component: 'vm'
        service_connection: 'DTS-HERITAGE-EXTSVC-STG'
        dependsOn: 'stg_core'
        destroyDependsOn:
          - 'stg_load_balancer'
          - 'stg_rbac'
      - deployment: 'stg_load_balancer'
        environment: 'stg'
        component: 'load-balancer'
        service_connection: 'DTS-HERITAGE-EXTSVC-STG'
        dependsOn: 'stg_vm'
        destroyDependsOn: 'prod_core'
      - deployment: 'stg_rbac'
        environment: 'stg'
        component: 'rbac'
        service_connection: 'ops-approval-gate-stg-envs'
        dependsOn: 'stg_vm'
        destroyDependsOn: 'prod_core'
      - deployment: 'prod_core'
        environment: 'prod'
        component: 'core'
        service_connection: 'DTS-HERITAGE-EXTSVC-PROD'
        dependsOn:
          - 'stg_load_balancer'
          - 'stg_rbac'
        destroyDependsOn: 'prod_vm'
      - deployment: 'prod_vm'
        environment: 'prod'
        component: 'vm'
        service_connection: 'DTS-HERITAGE-EXTSVC-PROD'
        dependsOn:
          - 'prod_core'
        destroyDependsOn:
          - 'prod_load_balancer'
          - 'prod_rbac'
      - deployment: 'prod_load_balancer'
        environment: 'prod'
        component: 'load-balancer'
        service_connection: 'DTS-HERITAGE-EXTSVC-PROD'
        dependsOn: 'prod_vm'
        destroyDependsOn: 'Precheck'
      - deployment: 'prod_rbac'
        environment: 'prod'
        component: 'rbac'
        service_connection: 'ops-approval-gate-prod-envs'
        dependsOn: 'prod_vm'
        destroyDependsOn: 'Precheck'

variables:
  # Must exceed the longest resource timeout (the 3600s DB Run Command) to
  # leave room for init, VM/extension provisioning and the command itself.
  - name: timeoutInMinutes
    value: 120
  - name: agentImage
    value: ubuntu-latest
  - name: product
    value: mcol
  - name: terraformInitSubscription
    value: 04d27a32-7a07-48b3-95b8-3c8691e1a263
  - template: vars/input-variables.yaml@cnp-azuredevops-libraries

stages:
  - stage: Precheck
    jobs:
      - job: TerraformPrecheck
        pool:
          vmImage: ${{ variables.agentImage }}
        steps:
          - template: steps/terraform-precheck.yaml@cnp-azuredevops-libraries
            parameters:
              keyvaultName: 'infra-vault-nonprod'
              keyvaultSecret: 'azure-devops-sp-token'
              serviceConnection: 'azurerm-sandbox'
              overrideAction: ${{ parameters.overrideAction }}

  - ${{ each deployment in parameters.environment_components }}:
    - stage: ${{ deployment.deployment }}
      # Destroy runs the stages in reverse of the create order so dependents
      # (load balancer/RBAC, then VMs, then core) are removed before what they
      # depend on, and prod before stg.
      ${{ if eq(parameters.overrideAction, 'destroy') }}:
        dependsOn: ${{ deployment.destroyDependsOn }}
      ${{ else }}:
        dependsOn: ${{ deployment.dependsOn }}
      jobs:
        - job: TerraformPlanApply
          pool: hmcts-sds-ptl
          timeoutInMinutes: ${{ variables.timeoutInMinutes }}
          ${{ if eq(deployment.component, 'vm') }}:
            variables:
              - group: ${{ deployment.service_connection }}
          steps:
            - template: steps/terraform.yaml@cnp-azuredevops-libraries
              parameters:
                overrideAction: ${{ parameters.overrideAction }}
                environment: ${{ deployment.environment }}
                component: ${{ deployment.component }}
                serviceConnection: ${{ deployment.service_connection }}
                terraformInitSubscription: ${{ variables.terraformInitSubscription }}
                product: ${{ variables.product }}
                ${{ if eq(deployment.component, 'vm') }}:
                  terraformEnvironmentVariables:
                    TF_VAR_storheritage003_build_share_key: $(TF_VAR_storheritage003_build_share_key)
                planCommandOptions:
                  -compact-warnings
